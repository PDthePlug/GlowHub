name: Apply theme continuity patch

on:
  push:
    branches:
      - feature/storefront-theme-continuity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/storefront-theme-continuity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch storefront public journeys
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'missing expected text in {path}: {old[:100]!r}')
              s=s.replace(old,new,count)
              p.write_text(s)

          # Booking: inherit storefront theme and finish mobile with the submit card.
          replace('src/PublicBooking.tsx', "import './public-booking.css';", "import './public-booking.css';\nimport './theme-continuity.css';")
          replace('src/PublicBooking.tsx', "type Service={id:string;name:string;price:number;duration:number;description:string};", "type Theme='editorial'|'soft-luxe'|'minimal';\ntype Service={id:string;name:string;price:number;duration:number;description:string};")
          replace('src/PublicBooking.tsx', "type Storefront={name:string;slug:string;location:string;services:Service[];bookingPolicy?:BookingPolicy};", "type Storefront={name:string;slug:string;location:string;services:Service[];bookingPolicy?:BookingPolicy;brand?:{theme?:Theme;accent?:string}};")
          replace('src/PublicBooking.tsx', "  if(success)return <main className='booking-page'>", "  const themeClass=`theme-${storefront.brand?.theme||'editorial'}`;\n  if(success)return <main className={`booking-page ${themeClass}`}>")
          replace('src/PublicBooking.tsx', "  return <main className='booking-page'>", "  return <main className={`booking-page ${themeClass}`}>")

          # Waitlist: inherit the same storefront theme.
          replace('src/PublicWaitlist.tsx', "import './public-waitlist.css';", "import './public-waitlist.css';\nimport './theme-continuity.css';")
          replace('src/PublicWaitlist.tsx', "type Service={id:string;name:string;price:number;duration:number;description:string};", "type Theme='editorial'|'soft-luxe'|'minimal';\ntype Service={id:string;name:string;price:number;duration:number;description:string};")
          replace('src/PublicWaitlist.tsx', "type Storefront={name:string;slug:string;location:string;services:Service[]};", "type Storefront={name:string;slug:string;location:string;services:Service[];brand?:{theme?:Theme;accent?:string}};")
          replace('src/PublicWaitlist.tsx', "  if(success)return <main className='waitlist-page'>", "  const themeClass=`theme-${storefront.brand?.theme||'editorial'}`;\n  if(success)return <main className={`waitlist-page ${themeClass}`}>")
          replace('src/PublicWaitlist.tsx', "  return <main className='waitlist-page'>", "  return <main className={`waitlist-page ${themeClass}`}>")

          # Service detail already had theme classes; import shared continuity refinements too.
          replace('src/ServiceGalleryPage.tsx', "import './service-gallery.css';", "import './service-gallery.css';\nimport './theme-continuity.css';")

          # Owner Website editor: preview first, website action beside preview, no scrolling up/down to compare looks.
          replace('src/StorefrontStudio.tsx', "</p></div><a href={publicLink(w.business.slug)} target='_blank' rel='noreferrer' className='pill dark'><ExternalLink size={15}/>Open my website</a></div>", "</p></div></div>")
          replace('src/StorefrontStudio.tsx', "<section className='rounded-[24px] border border-stone-200 bg-stone-100 p-5 md:p-6'><div className='flex items-center justify-between gap-3'><div><p className='eyebrow plain'>Live preview</p><h2 className='mt-2 font-serif text-2xl'>See the design before you save.</h2></div><span className='text-[10px] font-bold uppercase tracking-wider text-stone-400'>Phone</span></div>", "<section className='order-first rounded-[24px] border border-stone-200 bg-stone-100 p-5 md:p-6'><div className='flex items-start justify-between gap-3'><div><p className='eyebrow plain'>Live preview</p><h2 className='mt-2 font-serif text-2xl'>See it as you choose.</h2></div><a href={publicLink(w.business.slug)} target='_blank' rel='noreferrer' className='pill dark shrink-0'><ExternalLink size={15}/>Open website</a></div>")
          PY
      - name: Commit patched files
        run: |
          git config user.name "Glow Hub CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/PublicBooking.tsx src/PublicWaitlist.tsx src/ServiceGalleryPage.tsx src/StorefrontStudio.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Keep storefront theme through booking and improve website preview flow"
          git push origin HEAD:feature/storefront-theme-continuity
