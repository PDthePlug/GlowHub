name: Verify Glow Hub production

on:
  push:
    branches: [main, feature/discover-on-glowhub, feature/service-media-gallery, feature/premium-marketplace-service-crud]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Guard production auth redirect
        shell: bash
        run: |
          set -euo pipefail
          grep -q "PRODUCTION_APP_URL='https://glowhub-three.vercel.app'" src/platform-client.ts
          if grep -q 'localhost' src/platform-client.ts; then
            echo 'Production auth client must not contain a localhost redirect'
            exit 1
          fi

      - name: Verify service media gallery contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "multiple" src/StorefrontStudio.tsx
          grep -q "slice(0,8)" src/StorefrontStudio.tsx
          grep -q "media.matches?5:3" src/ServiceGalleryPage.tsx
          grep -q "View all work" src/ServiceGalleryPage.tsx
          grep -q "ServiceGalleryPage" src/main.tsx

      - name: Verify premium marketplace and service CRUD contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'sf-minimal-gallery.count-3' src/premium-v2.css
          grep -q 'grid-template-columns:repeat(2' src/discover-v2.css
          grep -q 'PUT /api/services/:id' backend/service-management.ts
          grep -q 'DELETE /api/services/:id' backend/service-management.ts
          grep -q 'Edit service' src/ServicesManager.tsx
          grep -q 'Delete' src/ServicesManager.tsx
          grep -q "ServicesSimple.*ServicesManager" src/BusinessSimple.tsx

      - name: Build production frontend
        run: npm run build

      - name: Verify Supabase Edge API
        shell: bash
        run: |
          set -euo pipefail
          API='https://lnxhtdaocawrqlldhxcz.supabase.co/functions/v1/glowhub-api'
          KEY='sb_publishable_Mv-3DPERIRKdQjOePp5JFQ_M5bbMW4x'

          echo 'Browser CORS preflight'
          curl --silent --show-error --dump-header /tmp/cors.headers --output /tmp/cors.body \
            -X OPTIONS \
            -H 'Origin: https://glowhub-three.vercel.app' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization,apikey,content-type' \
            "$API/api/me"
          grep -Eq '^HTTP/[0-9.]+ 20[04]' /tmp/cors.headers
          grep -qi '^access-control-allow-origin: \*' /tmp/cors.headers
          grep -qi '^access-control-allow-methods: .*GET' /tmp/cors.headers

          echo 'Health check'
          curl --fail --silent --show-error \
            -H "apikey: $KEY" \
            "$API/api/_healthcheck" | tee /tmp/health.json
          grep -q 'Glow Hub' /tmp/health.json

          echo 'Plans'
          curl --fail --silent --show-error \
            -H "apikey: $KEY" \
            "$API/api/plans" | tee /tmp/plans.json
          grep -q 'plans' /tmp/plans.json

          echo 'Discovery'
          curl --fail --silent --show-error \
            -H "apikey: $KEY" \
            "$API/api/discover" | tee /tmp/discover.json
          grep -q 'items' /tmp/discover.json

          echo 'Protected owner route rejects anonymous access'
          STATUS=$(curl --silent --output /tmp/me.json --write-out '%{http_code}' \
            -H "apikey: $KEY" \
            "$API/api/me")
          cat /tmp/me.json
          test "$STATUS" = '401'
          grep -q 'Sign in required' /tmp/me.json

      - name: Record built artifact summary
        run: |
          test -f dist/index.html
          find dist -type f -maxdepth 3 -print | sort

      - name: Upload verified production build
        uses: actions/upload-artifact@v4
        with:
          name: glowhub-production-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
